[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-tracker-server"
version = "0.1.0"
description = "LLM-first personal finance tracker — backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg2-binary>=2.9",
    "firebase-admin>=6.5",
    "cryptography>=42",
    # Phase 2 — LLM agent (LangGraph orchestrator + Gemini)
    "langgraph==1.2.6",
    "langchain==1.3.11",
    "langchain-core==1.4.8",
    "langchain-google-genai==4.2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["app", "app.routers"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
